name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 Quartz 插件依赖
        run: |
          ROOT=$(pwd)
          for d in .quartz/plugins/*/; do
            echo "安装: $d"
            cd "$d" && npm install && cd "$ROOT"
          done
      - name: 首次构建（安装插件并生成 .git）
        run: |
          chmod +x ./quartz/bootstrap-cli.mjs
          npx quartz build -d . -o public
      - name: 修复 KaTeX CDN（国内可访问）
        run: |
          find .quartz/plugins -name "index.js" -exec sed -i 's|cdn\.jsdelivr\.net/npm/katex@[^/]*/|cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/|g' {} \;
      - name: 重新构建（使用修复后的插件）
        run: |
          rm -rf public quartz/.quartz-cache
          npx quartz build -d . -o public
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
