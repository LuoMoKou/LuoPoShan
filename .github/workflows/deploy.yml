name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 Quartz 插件依赖
        run: |
          ROOT=$(pwd)
          for d in .quartz/plugins/*/; do
            echo "安装: $d"
            cd "$d" && npm install && cd "$ROOT"
          done
      - name: 构建网站
        run: |
          chmod +x ./quartz/bootstrap-cli.mjs
          npx quartz build -d . -o public
      - name: 注入 MathJax 客户端渲染
        run: |
          find public -name "*.html" -exec sed -i 's|</head>|<script>MathJax={tex:{inlineMath:[["\\$","\\$"]],displayMath:[["\\$\\$","\\$\\$"]]}}</script><script src="https://cdn.bootcdn.net/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"></script></head>|' {} \;
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
